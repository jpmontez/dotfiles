# prefix
unbind C-b
set -g prefix C-a
bind-key a send-prefix

bind C-k clear-history

# set scrollback
set-option -g history-limit 200000

# number windows/panes from 1 (next to the number keys, unlike 0) and close
# numbering gaps automatically when a window is closed
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# allow notifications and progress updates reach the outer terminal,
# including from panes that aren't currently visible
set -g allow-passthrough all

# let inner applications (e.g. Claude Code) set the system clipboard via OSC 52
set -s set-clipboard on

# enable extended key sequences (e.g. Shift/Ctrl/Alt combos) at the session level
set -s extended-keys on

# advertise extended key support for xterm-compatible terminals
set -as terminal-features 'xterm*:extkeys'

# 24-bit color so TUI themes (e.g. Claude Code) render accurately
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"

# Surface terminal bells (e.g. Claude Code "task ready") on the status line
# and forward every bell to the outer terminal so Ghostty can play its sound
# even when the originating pane is focused.
set -g monitor-bell on
set -g bell-action any
set -g window-status-bell-style "fg=red,bg=default,blink"

# quick switch between panes
unbind ^A
bind ^A select-pane -t :.+

# panes
bind tab next-layout

bind-key -r Up resize-pane -U 10
bind-key -r Down resize-pane -D 10
bind-key -r Left resize-pane -L 10
bind-key -r Right resize-pane -R 10

# Use vim keybindings in copy mode
setw -g mode-keys vi

# Setup 'v' to begin selection as in Vim
bind-key -T copy-mode-vi 'v' send -X begin-selection
if-shell "uname | grep -q Darwin" \
  "bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel 'pbcopy'" \
  "bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel 'xclip -in -selection clipboard'"

# Update default binding of `Enter` to also use copy-pipe
unbind -T copy-mode-vi Enter
if-shell "uname | grep -q Darwin" \
  "bind-key -T copy-mode-vi Enter send -X copy-pipe 'pbcopy'" \
  "bind-key -T copy-mode-vi Enter send -X copy-pipe 'xclip -in -selection clipboard'"

# Mouse support (scroll, resize, click-to-focus)
set -g mouse on

# Reload tmux config
bind r source-file ~/.tmux.conf \; display-message "Config reloaded"

# Surface the inner application's title (e.g. Claude Code's spinner/status)
# in the window list instead of just the process name
set -g set-titles on
set -g set-titles-string '#{pane_title}'

# Style with ANSI colours (not hex) so the status bar, borders, and popups
# follow whatever base16 scheme is currently active instead of a fixed palette
set -g pane-border-style "fg=colour8"
set -g pane-active-border-style "fg=colour4"
set -g popup-border-style "fg=colour4"
set -g message-style "fg=colour4,bg=colour0"

# dotbar paints the current window with `bg=default`, which inherits from this
# style — so any leftover background here (e.g. an old highlight block) shows
# through and can collide with the text colour. Pin it so reloads are
# deterministic; a live server keeps stale options that config edits don't clear.
setw -g window-status-current-style default

# tmux-dotbar status bar colours (see plugin block below), kept on the same
# base16 ANSI slots as the rest of the styling above. One colour, one job:
# colour7 is the window you're in, colour20 the ones you aren't, colour8 the
# ambient chrome, and colour4 is spent only on the prefix-armed state.
# colour20 is base04 only under a base16 palette (pinned in ghostty/config);
# on a stock ANSI palette that slot is a dark blue and will look wrong.
set -g @tmux-dotbar-bg "default"
set -g @tmux-dotbar-fg "colour20"
set -g @tmux-dotbar-fg-current "colour7"
set -g @tmux-dotbar-fg-session "colour8"
set -g @tmux-dotbar-fg-prefix "colour4"
set -g @tmux-dotbar-bold-current-window "true"
set -g @tmux-dotbar-right "true"

# Quick-launch popups, without disturbing the current window layout.
# display-popup runs shell-command via `sh -c`, not an interactive shell, so
# an explicit command needs `zsh -i -c` to see zshrc wrappers (e.g. the
# `claude` function's resume-last-session behavior); a bare shell (no
# command, prefix+b) gets an interactive login shell for free.
bind g display-popup -d "#{pane_current_path}" -w 85% -h 85% -E "zsh -i -c claude"
bind b display-popup -d "#{pane_current_path}" -w 85% -h 85% -E
bind G display-popup -d "#{pane_current_path}" -w 80% -h 80% -k "git status"

# Session/window picker in a popup instead of taking over the full pane
# (tmux's own default binding is `choose-tree -Zs`, unpopup'd)
bind s display-popup -E -w 70% -h 60% "tmux choose-tree -Zs"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-pain-control'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'vaaleyard/tmux-dotbar'

set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-processes '"~claude->claude --continue"'

set -g @continuum-restore 'on'

if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

run '~/.tmux/plugins/tpm/tpm'
